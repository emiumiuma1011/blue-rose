
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Star Rose</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: #4ade80; /* 錯誤提示顏色 */
            font-family: sans-serif;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
        #loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050510;
            z-index: 50;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.4",
    "react-dom": "https://esm.sh/react-dom@19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
    "three": "https://esm.sh/three@0.182.0",
    "three/addons/": "https://esm.sh/three@0.182.0/examples/jsm/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "three/": "https://esm.sh/three@^0.182.0/"
  }
}
</script>
</head>
<body>
    <div id="loading-screen">
        <div class="text-blue-400 animate-pulse tracking-widest">LOADING MIDNIGHT ROSE...</div>
        <div id="error-console" class="mt-4 text-red-500 text-xs max-w-md px-4 text-center"></div>
    </div>
    <div id="root"></div>

    <script type="text/javascript">
        // 全局錯誤捕獲，幫助用戶在手機或瀏覽器上直接看到報錯
        window.onerror = function(msg, url, line, col, error) {
            const console = document.getElementById('error-console');
            if (console) console.innerText = "Error: " + msg + "\nLine: " + line;
            return false;
        };
        window.addEventListener('unhandledrejection', function (event) {
            const console = document.getElementById('error-console');
            if (console) console.innerText = "Promise Error: " + event.reason;
        });
    </script>
    
    <!-- 核心：添加 .tsx 後綴，這是瀏覽器原生加載的關鍵 -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
