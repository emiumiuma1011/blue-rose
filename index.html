
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Star Rose</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: #4ade80;
            font-family: 'Georgia', serif;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
        #loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050510;
            z-index: 100;
        }
        .debug-hint {
            margin-top: 20px;
            font-size: 10px;
            color: #444;
            max-width: 80%;
            text-align: center;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "three": "https://esm.sh/three@0.170.0",
    "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "three/": "https://esm.sh/three@^0.182.0/"
  }
}
</script>
</head>
<body>
    <div id="loading-screen">
        <div class="text-blue-400 animate-pulse tracking-[0.3em] font-light">INITIATING ROSE...</div>
        <div id="error-console" class="mt-4 text-red-500 text-xs font-mono max-w-md px-4 text-center"></div>
        <div id="timeout-hint" class="debug-hint hidden">
            If it takes too long, please check if your browser supports WebGL or press F12 to see the console.
        </div>
    </div>
    <div id="root"></div>

    <script type="text/javascript">
        // 捕獲加載時的任何錯誤
        window.onerror = function(msg, url, line, col, error) {
            const console = document.getElementById('error-console');
            if (console) console.innerText = "Runtime Error: " + msg;
            return false;
        };
        
        // 如果 5 秒後還在 Loading，顯示提示
        setTimeout(() => {
            const hint = document.getElementById('timeout-hint');
            const loading = document.getElementById('loading-screen');
            if (loading && loading.style.display !== 'none' && hint) {
                hint.classList.remove('hidden');
            }
        }, 5000);
    </script>
    
    <script type="module" src="./index.tsx"></script>
</body>
</html>
